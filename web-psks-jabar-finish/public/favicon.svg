  <path d="M 50 25 C 57 25 68 30 68 42 C 68 58 50 74 50 74 C 50 74 32 58 32 42 C 32 30 43 25 50 25 Z" 
        fill="url(#goldGrad)" opacity="0.95" />
        
  <!-- Center Heart / Star of Social Services -->
